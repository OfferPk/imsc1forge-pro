<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#111827" stroke="#374151" stroke-width="1" />
  <rect x="24" y="16" width="46" height="32" rx="6" fill="url(#blueGrad)" />
  <text x="31" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#000">TTML</text>
  <text x="80" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f9fafb">IMSC1Forge Pro</text>
  <rect x="290" y="20" width="140" height="24" rx="4" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
  <text x="300" y="36" font-family="monospace" font-size="11" fill="#cbd5e1">W3C IMSC1 REC</text>
  
  <rect x="980" y="16" width="180" height="32" rx="6" fill="#10b981" />
  <text x="1008" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">✓ 10/10 AUDIT PASS</text>

  <!-- Main Content Grid -->
  <!-- Left Panel: Subtitle Stream Config -->
  <rect x="40" y="88" width="340" height="620" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" filter="url(#shadow)" />
  <text x="60" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Subtitle Stream Config</text>
  <line x1="60" y1="136" x2="360" y2="136" stroke="#374151" stroke-width="1" />

  <!-- Language -->
  <text x="60" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9ca3af">LANGUAGE TAG (BCP 47)</text>
  <rect x="60" y="176" width="300" height="36" rx="6" fill="#080c14" stroke="#4b5563" stroke-width="1" />
  <text x="72" y="199" font-family="monospace" font-size="13" fill="#f1f5f9">en (English Master)</text>

  <!-- Title -->
  <text x="60" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9ca3af">STREAM TITLE / PROGRAM</text>
  <rect x="60" y="244" width="300" height="36" rx="6" fill="#080c14" stroke="#4b5563" stroke-width="1" />
  <text x="72" y="267" font-family="monospace" font-size="13" fill="#f1f5f9">WAR_AND_PEACE_EP01_EN_SUB</text>

  <!-- Profile Spec -->
  <text x="60" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9ca3af">TARGET DELIVERY SPEC</text>
  <rect x="60" y="312" width="300" height="36" rx="6" fill="#080c14" stroke="#4b5563" stroke-width="1" />
  <text x="72" y="335" font-family="monospace" font-size="13" fill="#38bdf8">W3C IMSC1 Text Profile</text>

  <!-- Frame Rate & Timebase -->
  <text x="60" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9ca3af">FRAME RATE / TIMEBASE</text>
  <rect x="60" y="380" width="140" height="36" rx="6" fill="#080c14" stroke="#4b5563" stroke-width="1" />
  <text x="72" y="403" font-family="monospace" font-size="12" fill="#cbd5e1">24.00 fps</text>

  <rect x="220" y="380" width="140" height="36" rx="6" fill="#080c14" stroke="#4b5563" stroke-width="1" />
  <text x="232" y="403" font-family="monospace" font-size="12" fill="#cbd5e1">Clock Time</text>

  <!-- Typography -->
  <text x="60" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9ca3af">STYLING &amp; TYPOGRAPHY</text>
  <rect x="60" y="448" width="140" height="36" rx="6" fill="#080c14" stroke="#4b5563" stroke-width="1" />
  <text x="72" y="471" font-family="monospace" font-size="12" fill="#cbd5e1">Size: 80%</text>

  <rect x="220" y="448" width="140" height="36" rx="6" fill="#080c14" stroke="#4b5563" stroke-width="1" />
  <text x="232" y="471" font-family="monospace" font-size="12" fill="#cbd5e1">Color: #FFFFFF</text>

  <!-- Action Buttons -->
  <rect x="60" y="505" width="300" height="42" rx="6" fill="url(#goldGrad)" />
  <text x="115" y="531" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#000">Synthesize IMSC1 XML</text>

  <rect x="60" y="557" width="300" height="40" rx="6" fill="#334155" />
  <text x="135" y="582" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fff">Convert to WebVTT</text>

  <rect x="60" y="607" width="300" height="40" rx="6" fill="#1e293b" />
  <text x="145" y="632" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Export Standard SRT</text>

  <!-- Right Panel: Code & Broadcast Monitor -->
  <rect x="400" y="88" width="760" height="620" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" filter="url(#shadow)" />
  
  <!-- Tabs -->
  <rect x="416" y="104" width="150" height="34" rx="6" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
  <text x="435" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#9ca3af">SRT / Cue Input</text>

  <rect x="576" y="104" width="150" height="34" rx="6" fill="#38bdf8" />
  <text x="590" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#000">Broadcast Monitor</text>

  <rect x="736" y="104" width="140" height="34" rx="6" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
  <text x="755" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#9ca3af">IMSC1 XML</text>

  <rect x="886" y="104" width="140" height="34" rx="6" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
  <text x="908" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#9ca3af">10-Point Audit</text>

  <!-- Simulated Video Monitor Box -->
  <rect x="420" y="155" width="720" height="320" rx="6" fill="#030712" stroke="#374151" stroke-width="1" />
  <!-- Simulated 16:9 4K Video Background -->
  <rect x="430" y="165" width="700" height="300" rx="4" fill="#0f172a" />
  <text x="680" y="290" text-anchor="middle" font-family="monospace" font-size="14" fill="#475569">[16:9 4K UHD Master Video Simulation]</text>

  <!-- Subtitle Overlay Box -->
  <rect x="520" y="390" width="520" height="55" rx="4" fill="rgba(0,0,0,0.8)" stroke="#1e293b" stroke-width="1" />
  <text x="780" y="412" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Across the endless snows of Imperial Russia,</text>
  <text x="780" y="432" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff">armies gathered for the winter campaign.</text>

  <!-- Cue Navigation controls below monitor -->
  <text x="436" y="500" font-family="monospace" font-size="12" fill="#38bdf8">ACTIVE CUE 1 OF 3 (00:00:02.000 ➔ 00:00:05.500)</text>

  <!-- Live Audit Results Mini-Panel -->
  <rect x="420" y="515" width="720" height="175" rx="6" fill="#080c14" stroke="#374151" stroke-width="1" />
  <rect x="420" y="515" width="720" height="28" rx="6" fill="#111827" />
  <text x="436" y="534" font-family="monospace" font-size="11" font-weight="700" fill="#9ca3af">W3C IMSC1 &amp; NETFLIX TIMED TEXT NORMATIVE AUDIT (10/10 PASS)</text>

  <text x="436" y="560" font-family="monospace" font-size="11" fill="#10b981">✓ [IMSC-01] XML Declaration &amp; UTF-8: Standard UTF-8 XML prolog present</text>
  <text x="436" y="578" font-family="monospace" font-size="11" fill="#10b981">✓ [IMSC-02] Root &lt;tt&gt; &amp; Namespace: http://www.w3.org/ns/ttml conformant</text>
  <text x="436" y="596" font-family="monospace" font-size="11" fill="#10b981">✓ [IMSC-03] IMSC1 Extension Namespaces: ittp and ittm parameters declared</text>
  <text x="436" y="614" font-family="monospace" font-size="11" fill="#10b981">✓ [IMSC-04] Designated Profile URI: http://www.w3.org/ns/ttml/profile/imsc1/text</text>
  <text x="436" y="632" font-family="monospace" font-size="11" fill="#10b981">✓ [IMSC-05] Language Tag: BCP 47 xml:lang="en" confirmed</text>
  <text x="436" y="650" font-family="monospace" font-size="11" fill="#10b981">✓ [IMSC-06] Timebase &amp; Frame Rate: ttp:timeBase="media" at 24.00 fps</text>
  <text x="436" y="668" font-family="monospace" font-size="11" fill="#10b981">✓ [IMSC-07] Layout &amp; Cues: Active display region and 3 sequential cues aligned</text>
</svg>
